<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plenus - Gestión Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      @keyframes pulse-orange {
        0%, 100% { background-color: #f97316; /* orange-500 */ }
        50% { background-color: #d1d5db; /* gray-300 */ }
      }
      .animate-pulse-orange {
        animation: pulse-orange 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-purple {
        0%, 100% { background-color: #9333ea; /* purple-600 */ }
        50% { background-color: #d1d5db; /* gray-300 */ }
      }
      .animate-pulse-purple {
        animation: pulse-purple 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-green {
        0%, 100% { background-color: #16a34a; /* green-600 */ }
        50% { background-color: #22c55e; /* green-500 */ }
      }
      .animate-pulse-green {
        animation: pulse-green 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-amber {
        0%, 100% { background-color: #f59e0b; /* amber-500 */ }
        50% { background-color: #fcd34d; /* amber-300 */ }
      }
      .animate-pulse-amber {
        animation: pulse-amber 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-blue {
        0%, 100% { background-color: #3b82f6; /* blue-500 */ }
        50% { background-color: #93c5fd; /* blue-300 */ }
      }
      .animate-pulse-blue {
        animation: pulse-blue 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      /* Print styles */
      @media print {
        body * {
          visibility: hidden;
        }
        .print-section, .print-section * {
          visibility: visible;
        }
        .print-section {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
        .no-print {
          display: none !important;
        }
      }
      
      /* Make all inputs, textareas, and selects wider, more spacious, and highly visible */
      input[type="text"],
      input[type="tel"],
      input[type="email"],
      input[type="number"],
      input[type="date"],
      input[type="password"],
      select,
      textarea {
        border: 1px solid #94a3b8 !important; /* Very visible slate-400 border */
        border-radius: 0.5rem !important; /* Rounded-lg */
        padding: 0.55rem 0.85rem !important; /* Spacious padding */
        font-size: 0.875rem !important; /* text-sm */
        line-height: 1.25rem !important;
        background-color: #ffffff !important;
        color: #0f172a !important; /* slate-900 */
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
        transition: all 0.15s ease-in-out !important;
      }
      /* Ensure left-padded inputs with icons have correct padding */
      input.pl-4 {
        padding-left: 1rem !important;
      }
      input.pl-7 {
        padding-left: 1.75rem !important;
      }
      input.pl-9 {
        padding-left: 2.25rem !important;
      }
      input.pl-10 {
        padding-left: 2.5rem !important;
      }
      input[type="text"]:focus,
      input[type="tel"]:focus,
      input[type="email"]:focus,
      input[type="number"]:focus,
      input[type="date"]:focus,
      input[type="password"]:focus,
      select:focus,
      textarea:focus {
        border-color: #4f46e5 !important; /* Indigo-600 */
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15) !important; /* Indigo ring */
        outline: none !important;
      }
    </style>
